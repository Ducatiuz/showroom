/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:

.hero .slash{position:absolute;right:-12%;top:-30%;width:58%;height:170%;background:linear-gradient(180deg,rgba(204,0,0,.0),rgba(204,0,0,.22));transform:skewX(-18deg);border-left:1px solid rgba(255,255,255,.08)}

.kicker{font-family:'DSC',sans-serif;font-weight:700;font-size:12px;letter-spacing:.3em;color:var(--fg);text-transform:uppercase;display:flex;align-items:center;gap:12px}

.hero h1{font-family:var(--fx);font-weight:700;text-transform:uppercase;font-size:clamp(40px,11vw,112px);line-height:.92;letter-spacing:-.01em;margin:18px 0 18px}

.stats span{display:block;margin-top:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:60px;z-index:25;background:var(--black);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{position:relative;padding:18px 0;margin-right:28px;white-space:nowrap;font-family:'DSC','Montserrat',sans-serif;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dg);transition:color .2s}
.tab sup{font-size:10px;margin-left:4px;color:var(--red)}
.tab.on{color:var(--white)}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.tab.on::after{transform:scaleX(1)}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:22px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);padding:9px 14px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);transition:.2s}
.chip.on{border-color:var(--white);background:var(--white);color:var(--black)}
.chip span{color:var(--dg);margin-left:6px}
.chip.on span{color:var(--red)}

/* ---------- grid / cards ---------- */
.view{display:none;padding-bottom:60px}
.view.on{display:block;animation:fade .45s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{position:relative;background:var(--ink);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;transition:border-color .3s, transform .45s var(--ease);opacity:0;animation:rise .6s var(--ease) forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card:hover{border-color:#444}
.card:active{transform:scale(.99)}

.vis{position:relative;aspect-ratio:16/11;overflow:hidden;background:
  radial-gradient(70% 70% at 72% 78%,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%),
  linear-gradient(160deg,#1b1b1b,#0c0c0c 70%)}
.vis::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-62deg,rgba(255,255,255,.035) 0 1px,transparent 1px 14px);mask:linear-gradient(90deg,transparent,#000 60%)}
.vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;transition:transform 1.2s var(--ease)}
.card:hover .vis img{transform:scale(1.04)}
.vis.ph-on::after{content:"";position:absolute;inset:0}

.ghost{position:absolute;left:-4%;bottom:-6%;font-family:'DSX',sans-serif;font-weight:700;font-size:clamp(70px,24vw,150px);line-height:.8;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.22);white-space:nowrap;transition:transform 1.2s var(--ease)}
.card:hover .ghost{transform:translateX(-3%)}

.vis .bar{position:absolute;right:0;top:0;bottom:0;width:38%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--c) 30%,transparent));transform:skewX(-18deg) translateX(30%);border-left:1px solid rgba(255,255,255,.08)}
.vis .ph{position:absolute;right:16px;bottom:14px;font-family:'DSC',sans-serif;font-size:10px;letter-spacing:.28em;color:rgba(255,255,255,.38);text-transform:uppercase}
.badges{position:absolute;left:14px;top:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.st{display:inline-flex;align-items:center;gap:7px;background:rgba(15,15,15,.72);backdrop-filter:blur(6px);padding:6px 10px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.st i{width:7px;height:7px;border-radius:50%;background:#3BD16F;box-shadow:0 0 0 3px rgba(59,209,111,.18)}
.st.transit i{background:#F2B705;box-shadow:0 0 0 3px rgba(242,183,5,.18)}
.off{background:var(--red);font-family:'DSX',sans-serif;font-weight:700;font-size:15px;padding:6px 10px;letter-spacing:.02em}

.body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
.meta{display:flex;gap:10px;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);font-weight:600}

.card h3{font-family:'DSX',sans-serif;font-weight:700;font-size:22px;line-height:1.1;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.01em}
.ed{font-size:12.5px;color:var(--fg)}
.mini{display:flex;gap:18px;margin:16px 0 18px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mini div b{display:block;font-family:'DS',sans-serif;font-weight:700;font-size:17px}
.mini div span{font-size:11px;letter-spacing:.06em;color:var(--dg)}
.pr{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}

.pr .sv{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--red);padding:4px 7px}
.go{width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--white);color:var(--black);transition:.25s}
.card:hover .go{background:var(--red);color:var(--white)}
.note{font-size:11px;color:var(--dg);margin-top:8px}

/* ---------- empty / teaser views ---------- */
.intro{padding:34px 0 8px;max-width:640px}
.intro h2{font-family:var(--fx);font-weight:700;text-transform:uppercase;font-size:clamp(28px,6vw,52px);line-height:1}
html[lang="ru"] .intro h2{font-family:'Montserrat',sans-serif;font-weight:800;letter-spacing:-.02em}
.intro p{margin-top:14px;color:var(--lg);line-height:1.55}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:26px}

.fam div{background:var(--ink);padding:26px 16px;position:relative;overflow:hidden}
.fam b{font-family:'DSX',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em}
.fam span{display:block;margin-top:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dg)}
.fam div::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--red);transition:width .5s var(--ease)}
.fam div:hover::after{width:100%}
.reveal{margin-top:14px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--white);padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 22px;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:.25s}

/* ---------- order ---------- */

.ocard:active{transform:none}

.oprice{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:66px}

.obuy:hover{background:var(--red-d)}

.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}

.gcard:hover{border-color:#444}
.gimg{position:relative;aspect-ratio:1;background:#fff;overflow:hidden}

.sheet .gimg{aspect-ratio:1/1;max-height:62vh;margin:0 auto}

footer{border-top:1px solid var(--line);background:var(--ink)}

</style>

const goff = g => g.price && g.sale ? Math.round((1 - g.sale / g.price) * 100) : 0;
function gearCard(g, i){
  const img = g.img ? `<img src="${g.img}" alt="${esc(g.name)}" loading="lazy">` : `<div class="noph">DUCATI</div>`;
  const price = g.sale
    ? `<span class="was">${sum(g.price)}</span><span class="now">${sum(g.sale)}<small>${t("cur")}</small></span>`
    : `<span class="req">${t("req")}</span>`;
  return `<button class="gcard" style="animation-delay:${Math.min(i,12)*40}ms" data-g="${g.id}">
    <div class="gimg">${img}${goff(g)?`<span class="off">−${goff(g)}%</span>`:""}</div>
    <div class="gb"><div class="gcat">${t("gcats")[g.cat]}</div><div class="gname">${esc(g.name)}</div>
    <div class="gp">${price}</div></div></button>`;
}
function renderGear(){
  const has = GEAR.length > 0;
  $("#gearCats").style.display = has ? "none" : "";
  $("#gchips").style.display = has ? "" : "none";
  if (!has){
    $("#gearCats").innerHTML = t("cats").map(c=>`<div><b>${c[1].toUpperCase()}</b><span>${esc(c[0])}</span></div>`).join("");
    return;
  }
  const order = ["helmets","jackets","suits","pants","boots","gloves","mx"];
  const cats = ["all", ...order.filter(c => GEAR.some(g => g.cat === c))];
  $("#gchips").innerHTML = cats.map(c => {
    const n = c === "all" ? GEAR.length : GEAR.filter(g => g.cat === c).length;
    return `<button class="chip ${c===GSEG?"on":""}" data-gs="${c}">${t("gcats")[c]}<span>${n}</span></button>`;
  }).join("");
  const list = GEAR.filter(g => GSEG === "all" || g.cat === GSEG)
    .sort((a,b) => order.indexOf(a.cat) - order.indexOf(b.cat));
  $("#ggrid").innerHTML = list.map(gearCard).join("");
}
function openGear(id){
  const g = GEAR.find(x => x.id === id); if (!g) return;
  const img = g.img ? `<img src="${g.img}" alt="${esc(g.name)}">` : `<div class="noph">DUCATI</div>`;
  const price = g.sale
    ? `<div><span class="was">${sum(g.price)} ${t("cur")}</span><span class="now">${sum(g.sale)}<small style="font-size:14px;margin-left:6px;font-family:'DS','Montserrat',sans-serif;font-weight:400;color:var(--fg)">${t("cur")}</small></span></div><span class="save">${t("save").replace("{v}", sum(g.price - g.sale) + " " + t("cur"))}</span>`
    : `<div><span class="now" style="font-size:22px">${t("req")}</span></div>`;
  const tags = g.tags.map(k => `<span>${t("gtags")[k]}</span>`).join("");
  const msg = t("msgItem").replace("{b}", g.name + (g.size ? ", " + t("sizeL").toLowerCase() + " " + g.size : "")).replace("{a}", g.art)
    + (g.sale ? " " + t("priceL") + ": " + sum(g.sale) + " " + t("cur") + "." : "");
  $("#sheetBody").innerHTML = `<div class="gimg">${img}${goff(g)?`<span class="off">−${goff(g)}%</span>`:""}</div>
    <div class="in">
      <div class="meta">${t("gcats")[g.cat]} · ${t("art")} ${g.art}</div>
      <h2 style="font-size:clamp(24px,7vw,32px)">${esc(g.name)}</h2>
      ${tags ? `<div class="tags">${tags}</div>` : ""}
      <p class="tl">${g.size ? `${t("sizeL")}: <b>${g.size}</b>` : t("sizesAsk")}</p>
      <div class="pbox" style="margin-top:20px;flex-direction:column;align-items:flex-start;gap:12px">${price}</div>
      <div class="ctas">
        <a class="btn red" href="${tgLink(msg)}" target="_blank" rel="noopener">${ICON_TG}${t("wantTg")}</a>
        <a class="btn ghostb" href="${PHONE_HREF}">${ICON_PH}${t("call")}</a>
      </div>
      <div class="phone">${PHONE} · @ducatiuz_sales</div>
    </div>`;
  $("#sheet").classList.add("on"); $("#sheet").setAttribute("aria-hidden","false");
  document.body.classList.add("lock"); $("#sheet .pn").scrollTop = 0;
}

function openSheet(id){
  const b = STOCK.find(x => x.id === id); if (!b) return;
  const specs = specList(b).map(k => `<div><b>${num(b.specs[k])}<small>${t("u_"+k)}</small></b><span>${t(k)}</span></div>`).join("");
  const price = b.price
    ? `<div><span class="was">${money(b.oldPrice)}</span><span class="now">${money(b.price)}</span></div><span class="save">${t("save").replace("{v}", money(b.oldPrice-b.price))}</span>`
    : `<div><span class="now" style="font-size:22px">${t("req")}</span></div>`;
  const second = b.status === "transit" ? t("reserve") : t("test");
  $("#sheetBody").innerHTML = `${visual(b,true)}
    <div class="in">
      <div class="meta" style="--c:${b.hex}">${metaLine(b, true)}</div>
      <h2>${esc(b.name)}</h2>
      ${b.edition?`<div class="ed">${esc(b.edition[L])}</div>`:""}
      <p class="tl">${esc(b.tagline[L])}</p>
      <div class="specs">${specs}</div>
      ${b.highlights?`<div class="hl"><h5>${t("hl")}</h5><ul>${b.highlights[L].map(h=>`<li>${esc(h)}</li>`).join("")}</ul></div>`:""}
      <div class="pbox">${price}</div>
      ${b.exhaustIncluded?`<div class="note">${t("exhaust")}</div>`:""}
      <div class="ctas">
        <a class="btn red" href="${tgLink(t("msgBike").replace("{b}", bikeLabel(b)) + (b.price ? " " + t("priceL") + ": " + money(b.price) + "." : ""))}" target="_blank" rel="noopener">${ICON_TG}${t("wantTg")}</a>
        <div class="row">
          <a class="btn ghostb" href="${PHONE_HREF}">${ICON_PH}${t("call")}</a>
          <a class="btn ghostb" href="${tgLink(t(b.status === "transit" ? "msgRes" : "msgTestd").replace("{b}", bikeLabel(b)))}" target="_blank" rel="noopener">${second}</a>
        </div>
      </div>
      <div class="phone">${PHONE} · @ducatiuz_sales</div>
    </div>`;
  $("#sheet").classList.add("on"); $("#sheet").setAttribute("aria-hidden","false");
  document.body.classList.add("lock");
  $("#sheet .pn").scrollTop = 0;
}
function closeSheet(){ $("#sheet").classList.remove("on"); $("#sheet").setAttribute("aria-hidden","true"); document.body.classList.remove("lock"); }

function applyLang(){
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
  const max = Math.max(...STOCK.map(off));
  $("#sub").textContent = t("sub").replace("{n}", max);
  $("#sMax").textContent = "−" + max + "%";
  $("#sCount").textContent = STOCK.length;
  $("#tCount").textContent = STOCK.length;
  $("#gCount").textContent = GEAR.length || "";
  $("#oCount").textContent = ORDER.length || "";
  document.title = "Ducati Uzbekistan — " + t("tStock");
  renderStock(); renderOrder(); renderGear();
  $("#lnkOrder").href = tgLink(t("msgOrder"));
  $("#lnkGear").href = tgLink(t("msgGear"));
}
function route(){
  const h = (location.hash || "#stock").slice(1);
  VIEW = ["stock","order","gear"].includes(h) ? h : "stock";
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + VIEW));
  document.querySelectorAll(".tab").forEach(a => a.classList.toggle("on", a.dataset.v === VIEW));
}

document.addEventListener("click", e => {
  const l = e.target.closest("#lang button"); if (l){ L = l.dataset.l; try{localStorage.setItem("dl",L)}catch(_){} applyLang(); return; }
  const c = e.target.closest(".chip[data-s]"); if (c){ SEG = c.dataset.s; renderStock(); return; }
  const os = e.target.closest(".chip[data-os]"); if (os){ OSEG = os.dataset.os; renderOrder(); return; }
  const r = e.target.closest(".reveal[data-o]"); if (r){ REV.add(r.dataset.o); const o = ORDER.find(x => x.id === r.dataset.o); const card = r.closest(".ocard"); card.outerHTML = orderCard(o, 0); return; }
  const k = e.target.closest(".card[data-id]"); if (k){ openSheet(k.dataset.id); return; }
  const gs = e.target.closest(".chip[data-gs]"); if (gs){ GSEG = gs.dataset.gs; renderGear(); return; }
  const gc = e.target.closest(".gcard[data-g]"); if (gc){ openGear(gc.dataset.g); return; }
  if (e.target.closest("[data-close]")) closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
window.addEventListener("hashchange", () => { route(); window.scrollTo({top: document.querySelector(".tabs").offsetTop - 60, behavior:"smooth"}); });

// Telegram Mini App
const TGA = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined && Telegram.WebApp.platform !== "unknown" ? Telegram.WebApp : null;
if (TGA){
  try{ TGA.ready(); TGA.expand(); TGA.setHeaderColor("#0F0F0F"); TGA.setBackgroundColor("#0F0F0F"); }catch(_){}
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="https://t.me/"]');
    if (a){ e.preventDefault(); try{ TGA.openTelegramLink(a.href); }catch(_){ location.href = a.href; } }
  }, true);
}
(function init(){
  let saved = null; try{ saved = localStorage.getItem("dl"); }catch(_){}
  const nav = (navigator.language||"ru").slice(0,2);
  L = saved || (nav === "uz" ? "uz" : nav === "en" ? "en" : "ru");
  applyLang(); route();
})();
</script>
</body>
</html>
